<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f97316" />
    <title>WarungPulse Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #f8f9fa;
        color: #111827;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #ffffff;
        border: 1px solid #fed7aa;
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      }
      .mark {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        background: #fff7ed;
        color: #f97316;
        display: grid;
        place-items: center;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 16px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #4b5563; font-size: 14px; line-height: 1.55; margin: 0 0 16px; }
      ul { margin: 0 0 20px; padding-left: 18px; color: #374151; font-size: 13px; line-height: 1.7; }
      button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: #f97316;
        color: #ffffff;
        font-weight: 700;
        padding: 12px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">!</div>
      <h1>Sedang offline</h1>
      <p>WarungPulse tetap bisa membuka data yang sudah tersimpan di perangkat ini.</p>
      <ul>
        <li>Riwayat, produk, dan kasbon lokal tetap aman.</li>
        <li>Fitur AI membutuhkan internet.</li>
        <li>Backup data bisa dilakukan lagi setelah online.</li>
      </ul>
      <button onclick="window.location.reload()">Coba Muat Ulang</button>
    </main>
  </body>
</html>
